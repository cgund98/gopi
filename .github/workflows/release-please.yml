# Requires Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". Without that, release-please cannot open release PRs.
#
# The binary build runs in this same workflow, gated on the release output. A
# separate workflow on `release: published` would not fire: events created with
# the repository GITHUB_TOKEN do not start new workflow runs. Chaining
# in-workflow avoids needing a PAT or GitHub App token for release-please.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Publish to Go module proxy
        env:
          GOPROXY: proxy.golang.org
        run: go list -m github.com/cgund98/gopi@${{ needs.release-please.outputs.tag_name }}

      - name: Build binaries
        run: |
          set -euo pipefail
          version="${{ needs.release-please.outputs.tag_name }}"
          version="${version#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w" \
              -o "dist/gopi_${version}_${os}_${arch}" ./cmd/gopi
          done
          (cd dist && sha256sum gopi_* > checksums.txt)
          cat dist/checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --clobber
