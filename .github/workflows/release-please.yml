# Requires Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests". Without that, release-please cannot open release PRs.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      - name: Publish to Go module proxy
        if: ${{ steps.release.outputs.release_created }}
        env:
          GOPROXY: proxy.golang.org
        run: go list -m github.com/cgund98/gopi@${{ steps.release.outputs.tag_name }}
